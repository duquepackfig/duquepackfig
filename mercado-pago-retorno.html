<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>Retorno da autorização — DuquePack</title>
  <style>
    body { background: #24282c; color: #eff2f4; font: 18px/1.6 system-ui,sans-serif; max-width: 700px; margin: 10vh auto; padding: 24px; }
    button { background: #17624b; color: white; padding: 14px 20px; border: 1px solid #82c4ad; border-radius: 8px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Volte ao Assistente de Vendas</h1>
  <p>O retorno da autorização contém um código privado. Não envie a URL para ninguém, nem no chat.</p>
  <p>Clique abaixo e cole somente no campo “Retorno da autorização” da janela local do assistente.</p>
  <button id="copy" type="button">Copiar retorno para a janela local</button>
  <p id="status" role="status">Esta página não envia seu código a serviços externos.</p>
  <script>
    const button = document.getElementById('copy');
    let returnUrl = location.href;
    // Remove the code from the address and history before any user navigation.
    history.replaceState(null, '', location.pathname);
    const params = new URL(returnUrl).searchParams;
    if (!params.get('code') || !params.get('state')) {
      button.disabled = true;
      document.getElementById('status').textContent = 'Nenhuma autorização válida recebida. Inicie a autorização pela janela local do assistente.';
      returnUrl = '';
    }
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(returnUrl);
        document.getElementById('status').textContent = 'Copiado. Cole na janela local do assistente; não envie no chat. Depois da conexão, copie um texto comum para substituir este código na área de transferência.';
      } catch (_) {
        document.getElementById('status').textContent = 'Não foi possível copiar. Permita a área de transferência para esta página ou reinicie a autorização. Não compartilhe capturas com o código.';
      }
    });
  </script>
</body>
</html>
